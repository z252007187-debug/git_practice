<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>曾仁宥 | 個人自我介紹與作品集</title>
    <style>
        /* === 1. CSS 變數與全域重置 === */
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --border-color: #334155;
            --max-width: 1000px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        /* === 2. 導覽列 (Navbar) === */
        header {
            position: sticky;
            top: 0;
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }

        .nav-container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        /* === 3. 區塊通用樣式 === */
        main {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        section {
            padding: 5rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 1.75rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .section-title::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 24px;
            background-color: var(--accent);
            border-radius: 4px;
        }

        /* === 4. 主視覺區 (Hero Section) === */
        .hero {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }

        .hero-greeting {
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .hero-title {
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .hero-desc {
            color: var(--text-muted);
            max-width: 600px;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent);
            color: var(--bg-primary);
            font-weight: 600;
            padding: 0.75rem 1.75rem;
            border-radius: 6px;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            color: #fff;
            transform: translateY(-2px);
        }

        /* === 5. 關於我與技能 (About & Skills) === */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
        }

        .about-text p {
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-content: flex-start;
        }

        .skill-tag {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        /* === 6. 專案作品集 (Projects) === */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .project-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1.5rem;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .project-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }

        .project-title {
            font-size: 1.25rem;
            margin-bottom: 0.75rem;
            color: var(--accent);
        }

        .project-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.25rem;
        }

        .project-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-main);
        }

        .project-tech span {
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
        }

        /* === 7. 頁尾 (Footer) === */
        footer {
            text-align: center;
            padding: 3rem 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* === 8. 響應式設計 (RWD) === */
        @media (max-width: 768px) {
            .about-grid {
                grid-template-columns: 1fr;
            }
            .nav-links {
                gap: 1rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- 導覽列 -->
    <header>
        <nav class="nav-container">
            <a href="#" class="logo">REN-YOU.DEV</a>
            <ul class="nav-links">
                <li><a href="#about">關於我</a></li>
                <li><a href="#projects">專案作品</a></li>
                <li><a href="#contact">聯絡方式</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- 主視覺區 -->
        <section class="hero">
            <p class="hero-greeting">嗨，我是</p>
            <h1 class="hero-title">曾仁宥。<br>專注於 AI 應用與視覺開發。</h1>
            <p class="hero-desc">
                目前就讀於國立臺中科技大學人工智慧應用工程學位學程。熱衷於將電腦視覺、自動化爬蟲與機器學習技術轉化為解決實際問題的數位工具，同時熱愛研究科技產業趨勢與硬體改裝。
            </p>
            <a href="#projects" class="btn">瀏覽我的作品</a>
        </section>

        <!-- 關於我與技能 -->
        <section id="about">
            <h2 class="section-title">關於我 & 核心技能</h2>
